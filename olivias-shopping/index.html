<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Olivia's Back-to-School Shopping ✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<style>
  :root {
    --bg: #fdf5f8;
    --surface: #ffffff;
    --surface-2: #fceef4;
    --border: #f3d9e5;
    --ink: #3d2231;
    --ink-2: #7a5a6b;
    --ink-muted: #a8899a;
    --accent: #d6336c;
    --accent-soft: #fce3ec;
    --accent-deep: #a61e4d;
    --lavender: #7048b6;
    --lavender-soft: #efe7fb;
    --good: #1f7a4d;
    --good-soft: #d9f2e4;
    --warn: #8a6100;
    --warn-soft: #fdf0cd;
    --bad: #c0392b;
    --bad-soft: #fbe1dd;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(61,34,49,.06), 0 6px 18px rgba(61,34,49,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 500px at 85% -10%, #f6e4ff 0%, transparent 60%),
      radial-gradient(900px 450px at 5% -5%, #ffe4ef 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 26px; }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: .3px;
    background: linear-gradient(92deg, var(--accent-deep), var(--accent) 45%, var(--lavender));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 2px;
  }
  header p { color: var(--ink-2); margin-top: 6px; font-size: .95rem; }

  /* ---------- Stat tiles ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .stat .label {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .stat .value {
    font-size: 1.45rem;
    font-weight: 800;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .stat .sub { font-size: .74rem; color: var(--ink-2); margin-top: 2px; }
  .stat.negative .value { color: var(--bad); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 1.02rem;
    font-weight: 800;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---------- Form ---------- */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px 12px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.span-2 { grid-column: span 2; }
  @media (max-width: 560px) { .field.span-2 { grid-column: span 1; } }
  .field label {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  input, select, textarea {
    font: inherit;
    font-size: .9rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .form-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: .88rem;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    cursor: pointer;
    transition: transform .1s, filter .15s, background .15s;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(92deg, var(--accent), var(--accent-deep)); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--surface-2); color: var(--accent-deep); }
  .btn-ghost:hover { background: var(--accent-soft); }
  .cancel-note { font-size: .8rem; color: var(--ink-muted); }

  /* ---------- Filters ---------- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .filters input[type="search"] { flex: 1 1 180px; }
  .filters select { flex: 0 1 auto; }

  /* ---------- Item list ---------- */
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    background: #fff;
    transition: border-color .15s, background .15s;
  }
  .item:hover { border-color: #e8b9cd; }
  .item.purchased { background: var(--surface-2); }
  .item.purchased .name { text-decoration: line-through; color: var(--ink-muted); }

  .check {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fff;
    display: grid; place-items: center;
    font-size: .85rem;
    color: transparent;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .check.on { background: var(--good); border-color: var(--good); color: #fff; }

  .item-main { min-width: 0; }
  .item-main .name { font-weight: 700; font-size: .95rem; overflow-wrap: anywhere; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 5px;
    align-items: center;
  }
  .chip {
    font-size: .68rem;
    font-weight: 700;
    padding: 2.5px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .chip.cat { background: var(--lavender-soft); color: var(--lavender); }
  .chip.store { background: #eef3fb; color: #2b5aa0; }
  .chip.p-must { background: var(--bad-soft); color: var(--bad); }
  .chip.p-want { background: var(--warn-soft); color: var(--warn); }
  .chip.p-maybe { background: #eceff3; color: #5a6572; }
  .chip.s-wish { background: var(--accent-soft); color: var(--accent-deep); }
  .chip.s-cart { background: var(--warn-soft); color: var(--warn); }
  .chip.s-ordered { background: #e3edfb; color: #2b5aa0; }
  .chip.s-purchased { background: var(--good-soft); color: var(--good); }
  .notes { font-size: .78rem; color: var(--ink-2); margin-top: 5px; overflow-wrap: anywhere; }

  .item-side { text-align: right; flex-shrink: 0; }
  .money { font-weight: 800; font-variant-numeric: tabular-nums; font-size: .95rem; }
  .money .actual { color: var(--ink); }
  .money .budget { color: var(--ink-muted); font-weight: 600; font-size: .78rem; }
  .money.over .actual { color: var(--bad); }
  .row-actions { margin-top: 6px; display: flex; gap: 4px; justify-content: flex-end; }
  .icon-btn {
    background: none;
    padding: 4px 7px;
    border-radius: 7px;
    font-size: .85rem;
    color: var(--ink-muted);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--accent-deep); }

  .empty {
    text-align: center;
    color: var(--ink-muted);
    padding: 34px 10px;
    font-size: .92rem;
  }
  .empty .big { font-size: 2rem; display: block; margin-bottom: 8px; }

  @media (max-width: 560px) {
    .item { grid-template-columns: auto 1fr; }
    .item-side { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .row-actions { margin-top: 0; }
  }

  /* ---------- Category breakdown ---------- */
  .cat-row {
    display: grid;
    grid-template-columns: 130px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .cat-name { font-size: .85rem; font-weight: 700; color: var(--ink-2); }
  .meter {
    height: 10px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .meter .fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--lavender));
    transition: width .35s ease;
  }
  .meter .fill.over { background: var(--bad); }
  .cat-row .cat-nums {
    font-size: .8rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .cat-row .cat-nums strong { color: var(--ink); }
  .cat-row .cat-nums .over-flag { color: var(--bad); font-weight: 700; }
  @media (max-width: 560px) {
    .cat-row { grid-template-columns: 1fr auto; }
    .cat-row .meter { grid-column: 1 / -1; }
  }

  /* ---------- Footer ---------- */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    color: var(--ink-muted);
    font-size: .78rem;
    margin-top: 6px;
  }
  footer .tools { display: flex; gap: 8px; }
  footer button { font-size: .75rem; padding: 6px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ Olivia's Back-to-School Shopping ✨</h1>
    <p>Plan the look • Set the budget • Track every find • Check it all off</p>
  </header>

  <section class="stats" id="stats" aria-label="Budget summary"></section>

  <section class="card" id="formCard">
    <h2 id="formTitle">🛍️ Add something cute</h2>
    <form id="itemForm">
      <div class="form-grid">
        <div class="field span-2">
          <label for="fName">Item / Wish</label>
          <input id="fName" required maxlength="80" placeholder="e.g. First-day outfit" autocomplete="off">
        </div>
        <div class="field">
          <label for="fCategory">Category</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label for="fStore">Store</label>
          <input id="fStore" maxlength="40" placeholder="Target, Sephora…" autocomplete="off">
        </div>
        <div class="field">
          <label for="fPriority">Priority</label>
          <select id="fPriority"></select>
        </div>
        <div class="field">
          <label for="fStatus">Status</label>
          <select id="fStatus"></select>
        </div>
        <div class="field">
          <label for="fBudget">Budget ($)</label>
          <input id="fBudget" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label for="fActual">Actual cost ($)</label>
          <input id="fActual" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label for="fDate">Date bought</label>
          <input id="fDate" type="date">
        </div>
        <div class="field span-2">
          <label for="fNotes">Notes / size / color / link</label>
          <input id="fNotes" maxlength="200" placeholder="Add size, color or link here" autocomplete="off">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="saveBtn">Add to list 💖</button>
        <button type="button" class="btn-ghost" id="cancelEditBtn" hidden>Cancel</button>
        <span class="cancel-note" id="editNote" hidden>Editing an item — save or cancel</span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>📋 The list</h2>
    <div class="filters">
      <input type="search" id="fltSearch" placeholder="Search items, stores, notes…" aria-label="Search items">
      <select id="fltCategory" aria-label="Filter by category"></select>
      <select id="fltStatus" aria-label="Filter by status"></select>
      <select id="fltPriority" aria-label="Filter by priority"></select>
      <select id="fltSort" aria-label="Sort items">
        <option value="added">Newest first</option>
        <option value="category">By category</option>
        <option value="priority">By priority</option>
        <option value="budget">Budget: high → low</option>
        <option value="name">A → Z</option>
      </select>
    </div>
    <div class="items" id="itemList"></div>
  </section>

  <section class="card">
    <h2>💸 Budget by category</h2>
    <div id="catBreakdown"></div>
  </section>

  <footer>
    <span>Saved automatically in this browser 💾</span>
    <span class="tools">
      <button class="btn-ghost" id="exportBtn">Export backup</button>
      <button class="btn-ghost" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  const CATEGORIES = ["Clothes", "Shoes", "Accessories", "School Supplies", "Beauty", "Tech", "Sports", "Other"];
  const PRIORITIES = ["Must Have", "Really Want", "Maybe"];
  const STATUSES = ["Wish List", "In Cart", "Ordered", "Purchased"];
  const PRIORITY_CLASS = { "Must Have": "p-must", "Really Want": "p-want", "Maybe": "p-maybe" };
  const STATUS_CLASS = { "Wish List": "s-wish", "In Cart": "s-cart", "Ordered": "s-ordered", "Purchased": "s-purchased" };
  const STORE_KEY = "olivias-shopping-v1";

  const seed = [{
    id: "seed-1",
    name: "First-day outfit",
    category: "Clothes",
    store: "",
    priority: "Must Have",
    status: "Wish List",
    budget: 0,
    actual: 0,
    date: "",
    notes: "Add size, color or link here",
    added: 1
  }];

  let items = load();
  let editingId = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) { /* fall through to seed */ }
    return seed.slice();
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(items)); } catch (e) { /* storage full/blocked */ }
  }

  const $ = (id) => document.getElementById(id);
  const money = (n) => "$" + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function fillSelect(el, options, extraFirst) {
    el.innerHTML = "";
    if (extraFirst) {
      const o = document.createElement("option");
      o.value = "";
      o.textContent = extraFirst;
      el.appendChild(o);
    }
    options.forEach((v) => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      el.appendChild(o);
    });
  }

  fillSelect($("fCategory"), CATEGORIES);
  fillSelect($("fPriority"), PRIORITIES);
  fillSelect($("fStatus"), STATUSES);
  fillSelect($("fltCategory"), CATEGORIES, "All categories");
  fillSelect($("fltStatus"), STATUSES, "All statuses");
  fillSelect($("fltPriority"), PRIORITIES, "All priorities");

  /* ---------- Stats ---------- */
  function renderStats() {
    const planned = items.reduce((s, i) => s + (Number(i.budget) || 0), 0);
    const spent = items.reduce((s, i) => s + (Number(i.actual) || 0), 0);
    const left = planned - spent;
    const purchased = items.filter((i) => i.status === "Purchased").length;
    const tiles = [
      { label: "Planned budget", value: money(planned) },
      { label: "Actual spent", value: money(spent) },
      { label: "Money left", value: money(left), negative: left < 0, sub: left < 0 ? "Over budget!" : "" },
      { label: "Purchased", value: purchased + " / " + items.length, sub: "items checked off" },
      { label: "Items listed", value: String(items.length) }
    ];
    $("stats").innerHTML = tiles.map((t) =>
      '<div class="stat' + (t.negative ? " negative" : "") + '">' +
        '<div class="label">' + t.label + "</div>" +
        '<div class="value">' + t.value + "</div>" +
        (t.sub ? '<div class="sub">' + t.sub + "</div>" : "") +
      "</div>"
    ).join("");
  }

  /* ---------- List ---------- */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function visibleItems() {
    const q = $("fltSearch").value.trim().toLowerCase();
    const cat = $("fltCategory").value;
    const st = $("fltStatus").value;
    const pr = $("fltPriority").value;
    let list = items.filter((i) =>
      (!cat || i.category === cat) &&
      (!st || i.status === st) &&
      (!pr || i.priority === pr) &&
      (!q || (i.name + " " + i.store + " " + i.notes).toLowerCase().includes(q))
    );
    const sort = $("fltSort").value;
    const pRank = (i) => PRIORITIES.indexOf(i.priority);
    if (sort === "category") list.sort((a, b) => CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category) || pRank(a) - pRank(b));
    else if (sort === "priority") list.sort((a, b) => pRank(a) - pRank(b));
    else if (sort === "budget") list.sort((a, b) => (Number(b.budget) || 0) - (Number(a.budget) || 0));
    else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
    else list.sort((a, b) => (b.added || 0) - (a.added || 0));
    return list;
  }

  function renderList() {
    const list = visibleItems();
    const wrap = $("itemList");
    if (!list.length) {
      wrap.innerHTML = '<div class="empty"><span class="big">🎀</span>' +
        (items.length ? "Nothing matches those filters." : "Your list is empty — add your first find above!") +
        "</div>";
      return;
    }
    wrap.innerHTML = list.map((i) => {
      const bought = i.status === "Purchased";
      const over = (Number(i.actual) || 0) > (Number(i.budget) || 0) && (Number(i.budget) || 0) > 0;
      return (
        '<div class="item' + (bought ? " purchased" : "") + '" data-id="' + i.id + '">' +
          '<button class="check' + (bought ? " on" : "") + '" data-act="toggle" title="' + (bought ? "Mark as not purchased" : "Mark as purchased") + '" aria-label="Toggle purchased">✓</button>' +
          '<div class="item-main">' +
            '<div class="name">' + esc(i.name) + "</div>" +
            '<div class="meta">' +
              '<span class="chip cat">' + esc(i.category) + "</span>" +
              (i.store ? '<span class="chip store">📍 ' + esc(i.store) + "</span>" : "") +
              '<span class="chip ' + PRIORITY_CLASS[i.priority] + '">' + esc(i.priority) + "</span>" +
              '<span class="chip ' + STATUS_CLASS[i.status] + '">' + esc(i.status) + (bought && i.date ? " · " + esc(i.date) : "") + "</span>" +
            "</div>" +
            (i.notes ? '<div class="notes">📝 ' + esc(i.notes) + "</div>" : "") +
          "</div>" +
          '<div class="item-side">' +
            '<div class="money' + (over ? " over" : "") + '">' +
              '<span class="actual">' + money(i.actual) + "</span> " +
              '<span class="budget">/ ' + money(i.budget) + " budget</span>" +
            "</div>" +
            '<div class="row-actions">' +
              '<button class="icon-btn" data-act="edit" title="Edit">✏️</button>' +
              '<button class="icon-btn" data-act="delete" title="Delete">🗑️</button>' +
            "</div>" +
          "</div>" +
        "</div>"
      );
    }).join("");
  }

  /* ---------- Category breakdown ---------- */
  function renderBreakdown() {
    const rows = CATEGORIES.map((cat) => {
      const inCat = items.filter((i) => i.category === cat);
      const planned = inCat.reduce((s, i) => s + (Number(i.budget) || 0), 0);
      const spent = inCat.reduce((s, i) => s + (Number(i.actual) || 0), 0);
      return { cat, planned, spent, left: planned - spent, count: inCat.length };
    }).filter((r) => r.count > 0 || r.planned > 0);

    if (!rows.length) {
      $("catBreakdown").innerHTML = '<div class="empty">Add items with budgets to see the breakdown 🌸</div>';
      return;
    }
    $("catBreakdown").innerHTML = rows.map((r) => {
      const pct = r.planned > 0 ? Math.min(100, (r.spent / r.planned) * 100) : (r.spent > 0 ? 100 : 0);
      const over = r.left < 0;
      return (
        '<div class="cat-row">' +
          '<div class="cat-name">' + esc(r.cat) + "</div>" +
          '<div class="meter" role="img" aria-label="' + esc(r.cat) + ": spent " + money(r.spent) + " of " + money(r.planned) + '">' +
            '<div class="fill' + (over ? " over" : "") + '" style="width:' + pct + '%"></div>' +
          "</div>" +
          '<div class="cat-nums"><strong>' + money(r.spent) + "</strong> of " + money(r.planned) +
            (over ? ' · <span class="over-flag">' + money(-r.left) + " over</span>" : " · " + money(r.left) + " left") +
          "</div>" +
        "</div>"
      );
    }).join("");
  }

  function renderAll() {
    renderStats();
    renderList();
    renderBreakdown();
  }

  /* ---------- Form ---------- */
  function resetForm() {
    editingId = null;
    $("itemForm").reset();
    $("fCategory").value = CATEGORIES[0];
    $("fPriority").value = PRIORITIES[0];
    $("fStatus").value = STATUSES[0];
    $("formTitle").textContent = "🛍️ Add something cute";
    $("saveBtn").textContent = "Add to list 💖";
    $("cancelEditBtn").hidden = true;
    $("editNote").hidden = true;
  }

  $("itemForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = {
      name: $("fName").value.trim(),
      category: $("fCategory").value,
      store: $("fStore").value.trim(),
      priority: $("fPriority").value,
      status: $("fStatus").value,
      budget: parseFloat($("fBudget").value) || 0,
      actual: parseFloat($("fActual").value) || 0,
      date: $("fDate").value,
      notes: $("fNotes").value.trim()
    };
    if (!data.name) return;
    if (editingId) {
      const it = items.find((i) => i.id === editingId);
      if (it) Object.assign(it, data);
    } else {
      items.push(Object.assign({ id: "i" + Date.now() + Math.random().toString(36).slice(2, 7), added: Date.now() }, data));
    }
    save();
    resetForm();
    renderAll();
  });

  $("cancelEditBtn").addEventListener("click", resetForm);

  /* ---------- Row actions ---------- */
  $("itemList").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.closest(".item").dataset.id;
    const it = items.find((i) => i.id === id);
    if (!it) return;
    const act = btn.dataset.act;
    if (act === "toggle") {
      if (it.status === "Purchased") {
        it.status = "Wish List";
        it.date = "";
      } else {
        it.status = "Purchased";
        if (!it.date) it.date = new Date().toISOString().slice(0, 10);
        if (!it.actual && it.budget) it.actual = it.budget;
      }
      save();
      renderAll();
    } else if (act === "delete") {
      if (confirm('Delete "' + it.name + '" from the list?')) {
        items = items.filter((i) => i.id !== id);
        save();
        renderAll();
      }
    } else if (act === "edit") {
      editingId = id;
      $("fName").value = it.name;
      $("fCategory").value = it.category;
      $("fStore").value = it.store || "";
      $("fPriority").value = it.priority;
      $("fStatus").value = it.status;
      $("fBudget").value = it.budget || "";
      $("fActual").value = it.actual || "";
      $("fDate").value = it.date || "";
      $("fNotes").value = it.notes || "";
      $("formTitle").textContent = "✏️ Edit item";
      $("saveBtn").textContent = "Save changes 💾";
      $("cancelEditBtn").hidden = false;
      $("editNote").hidden = false;
      $("formCard").scrollIntoView({ behavior: "smooth", block: "start" });
      $("fName").focus();
    }
  });

  /* ---------- Filters ---------- */
  ["fltSearch", "fltCategory", "fltStatus", "fltPriority", "fltSort"].forEach((id) => {
    $(id).addEventListener("input", renderList);
  });

  /* ---------- Backup ---------- */
  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "olivias-shopping-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("bad format");
        if (confirm("Replace the current list with " + parsed.length + " item(s) from this backup?")) {
          items = parsed;
          save();
          renderAll();
        }
      } catch (err) {
        alert("That file doesn't look like a valid backup.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  resetForm();
  renderAll();
})();
</script>
</body>
</html>
